spring.application.name=drive

# Base de datos (MySQL en Docker)
spring.datasource.url=jdbc:mysql://localhost:3307/drive
spring.datasource.username=drive
spring.datasource.password=drive

# Crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las consultas SQL
spring.jpa.show-sql=true
# Las consultas a la base solo ocurren en los servicios, no mientras se arma la respuesta
spring.jpa.open-in-view=false

# Tamanio maximo de los archivos subidos (por defecto Spring permite 1 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Errores de Spring en formato ProblemDetail, igual que los propios
spring.mvc.problemdetails.enabled=true